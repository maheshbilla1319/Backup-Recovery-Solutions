
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="404 Page Not Found | Backup & Recovery Solutions">

    <title>404 | Page Not Found</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/404.css">
</head>

<body>

    <!-- Background -->
    <div class="background" aria-hidden="true">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="grid"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <a href="index.html" class="logo" aria-label="Backup & Recovery Solutions Home">
            <span class="logo-image">
                <img
                    src="assets/img-1.webp"
                    alt="Backup & Recovery Solutions Logo">
            </span>
        </a>
    </header>

    <!-- 404 Content -->
    <main class="error-page">

        <!-- Error Content -->
        <section class="error-content" aria-labelledby="error-title">

            <!-- 404 Number -->
            <div class="error-number" aria-label="404 Error">
                <span>4</span>

                <div class="server-icon" aria-hidden="true">
                    <i class="fa-solid fa-server"></i>
                </div>

                <span>4</span>
            </div>

            <!-- Error Tag -->
            <div class="error-tag">
                <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                <span>PAGE NOT FOUND</span>
            </div>

            <!-- Heading -->
            <h1 id="error-title">
                Oops! Page
                <span>Not Found</span>
            </h1>

            <!-- Description -->
            <p>
                The page you're looking for may have been moved,
                deleted, or temporarily unavailable.
                Don't worry, your data is still safe and protected.
            </p>

            <!-- Buttons -->
            <div class="error-buttons">

                <!-- Back To Home -->
                <a
                    href="index.html"
                    class="btn btn-primary">

                    <i class="fa-solid fa-house" aria-hidden="true"></i>
                    <span>Back to Home</span>

                </a>

                <!-- Previous Page -->
                <button
                    type="button"
                    onclick="goBack()"
                    class="btn btn-outline-gold">

                    <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                    <span>Previous Page</span>

                </button>

            </div>

            <!-- Support -->
            <div class="support-text">
                <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                <span>Secure • Protected • Reliable</span>
            </div>

        </section>

        <!-- Illustration -->
        <section
            class="error-illustration"
            aria-hidden="true">

            <div class="illustration-circle"></div>

            <!-- Server -->
            <div class="server">

                <div class="server-top">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="server-body">

                    <div class="server-line">
                        <span></span>
                        <i></i>
                    </div>

                    <div class="server-line">
                        <span></span>
                        <i></i>
                    </div>

                    <div class="server-line">
                        <span></span>
                        <i></i>
                    </div>

                    <div class="server-line">
                        <span></span>
                        <i></i>
                    </div>

                </div>

            </div>

            <!-- Floating Icons -->
            <div class="floating-icon icon-cloud">
                <i class="fa-solid fa-cloud"></i>
            </div>

            <div class="floating-icon icon-shield">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <div class="floating-icon icon-database">
                <i class="fa-solid fa-database"></i>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">

        <span>
            © 2026 Backup & Recovery Solutions
        </span>

        <span>
            <i class="fa-solid fa-circle" aria-hidden="true"></i>
            All Systems Operational
        </span>

    </footer>

    <!-- Custom JavaScript -->
    <script src="javascript/404.js"></script>

</body>

</html>
