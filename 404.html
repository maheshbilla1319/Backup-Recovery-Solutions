<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="404 Page Not Found | Backup & Recovery Solutions">

    <title>404 | Page Not Found</title>

    <!-- Google Font -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="css/404.css">

</head>


<body>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="background">

        <div class="glow glow-one"></div>

        <div class="glow glow-two"></div>

        <div class="grid"></div>

    </div>



    <!-- =========================================
         HEADER / LOGO
    ========================================== -->

    <header class="header">

  
        <a href="index.html" class="logo">

            <span class="logo-image">
                <img
                    src="assets/img-1.webp"
                    alt="Backup & Recovery Solutions Logo">
            </span>

           

        </a>


    </header>



    <!-- =========================================
         404 CONTENT
    ========================================== -->

    <main class="error-page">


        <div class="error-content">


            <!-- 404 -->

            <div class="error-number">

                <span>4</span>

                <div class="server-icon">

                    <i class="fa-solid fa-server"></i>

                </div>

                <span>4</span>

            </div>



            <!-- TEXT -->

            <span class="error-tag">

                <i class="fa-solid fa-triangle-exclamation"></i>

                PAGE NOT FOUND

            </span>


            <h1>

                Oops! Page

                <span>Not Found</span>

            </h1>


            <p>

                The page you're looking for may have been
                moved, deleted, or temporarily unavailable.

                Don't worry, your data is still safe and protected.

            </p>



            <!-- =================================
                 BUTTONS
            ================================== -->

            <div class="error-buttons">


                <!-- Back To Home -->

                <a href="index.html"
                    class="btn btn-primary">

                    <i class="fa-solid fa-house"></i>

                    Back to Home

                </a>



                <!-- Previous Page -->

                  <a href="index.html"
                    class="btn btn-primary">

                    <i class="fa-solid fa-house"></i>

                   Previous Page

                </a>
            </div>
    


            <!-- SUPPORT -->

            <div class="support-text">

                <i class="fa-solid fa-shield-halved"></i>

                Secure • Protected • Reliable

            </div>


        </div>



        <!-- =========================================
             RIGHT ILLUSTRATION
        ========================================== -->

        <div class="error-illustration">


            <div class="illustration-circle"></div>


            <div class="server">

                <div class="server-top">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="server-body">

                    <div class="server-line">

                        <span></span>
                        <i></i>

                    </div>

                    <div class="server-line">

                        <span></span>
                        <i></i>

                    </div>

                    <div class="server-line">

                        <span></span>
                        <i></i>

                    </div>

                    <div class="server-line">

                        <span></span>
                        <i></i>

                    </div>

                </div>

            </div>


            <div class="floating-icon icon-cloud">

                <i class="fa-solid fa-cloud"></i>

            </div>


            <div class="floating-icon icon-shield">

                <i class="fa-solid fa-shield-halved"></i>

            </div>


            <div class="floating-icon icon-database">

                <i class="fa-solid fa-database"></i>

            </div>


        </div>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="footer">

        <span>
            © 2026 Backup & Recovery Solutions
        </span>

        <span>
            <i class="fa-solid fa-circle"></i>
            All Systems Operational
        </span>

    </footer>



    <!-- JS -->

    <script src="javascript/404.js"></script>

</body>

</html>
